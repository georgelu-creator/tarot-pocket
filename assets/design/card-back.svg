<svg xmlns="http://www.w3.org/2000/svg" width="300" height="500" viewBox="0 0 300 500">
  <!-- Flat print artwork. Component radius, thickness and lighting are separate. -->
  <defs>
    <!-- Every off-centre mark is printed twice, related by an exact half-turn. -->
    <g id="celestial-pair" fill="#F6F1E9">
      <path d="M150 53 L152.4 64.6 L159 68 L152.4 71.4 L150 83 L147.6 71.4 L141 68 L147.6 64.6 Z"/>
      <circle cx="150" cy="96" r="1.2" opacity="0.72"/>
      <path d="M134 115 A17 17 0 1 0 166 115 A16.2 16.2 0 0 1 134 115 Z"/>
      <path d="M150 146 V168" fill="none" stroke="#F6F1E9" stroke-width="1" opacity="0.6"/>
      <circle cx="150" cy="176" r="2.1"/>
      <circle cx="44" cy="250" r="2.4"/>
      <circle cx="70" cy="166" r="1.15" opacity="0.64"/>
    </g>
  </defs>
  <rect id="substrate" width="300" height="500" fill="#60465C"/>
  <rect x="20" y="20" width="260" height="460" rx="11" fill="none" stroke="#F6F1E9" stroke-width="1.15" opacity="0.62"/>
  <g id="orbits" fill="none" stroke="#F6F1E9" stroke-width="1.15" opacity="0.64">
    <ellipse cx="150" cy="250" rx="109" ry="57" transform="rotate(32 150 250)"/>
    <ellipse cx="150" cy="250" rx="109" ry="57" transform="rotate(-32 150 250)"/>
    <ellipse cx="150" cy="250" rx="77" ry="124" opacity="0.66"/>
  </g>
  <circle cx="150" cy="250" r="60" fill="#60465C" stroke="#F6F1E9" stroke-width="1.8"/>
  <circle cx="150" cy="250" r="63" fill="none" stroke="#F6F1E9" stroke-width="0.85" opacity="0.7"/>
  <use href="#celestial-pair"/>
  <use href="#celestial-pair" transform="rotate(180 150 250)"/>
</svg>
