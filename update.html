<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E9">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-TAROT_UPDATE_SCRIPT_HASH'; style-src 'unsafe-inline'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Tarot Pocket · 更新 / Update</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f1e9;color:#282431;font:16px/1.7 system-ui,-apple-system,sans-serif}main{max-width:520px;margin:8vh auto;padding:28px 24px}h1{font-family:Georgia,serif;font-weight:500;font-size:34px;line-height:1.25}p{color:#625966}button,a{font:inherit;min-height:48px;border-radius:14px;padding:12px 20px}button{width:100%;border:0;background:#654763;color:#fff;cursor:pointer;margin:8px 0}button:disabled{opacity:.6;cursor:wait}a{display:block;text-align:center;color:#654763;text-decoration:none}small{display:block;font-size:12px;overflow-wrap:anywhere;color:#736774}progress{width:100%;accent-color:#654763}#status{min-height:72px;padding:16px;background:#fffaf3;border-radius:16px}.language{width:auto;float:right;padding:6px 14px;background:transparent;color:#654763}.hidden{display:none}.note{font-size:14px}
</style>
</head>
<body><main>
<button class="language" id="language">EN</button>
<small>TAROT POCKET</small>
<h1 id="title">带着记录，进入新版</h1>
<p id="intro">下载并校验新版完整内容，再由你决定何时进入。学习进度、抽牌和日签记录保留在本机。</p>
<div id="status" role="status" aria-live="polite"></div>
<progress id="progress" hidden></progress>
<button id="download">检查并下载新版</button>
<button id="continue" class="hidden">保留记录，进入新版</button>
<a id="back" href="./?lang=zh">返回当前应用</a>
<p id="note" class="note">请先完成其他标签页中正在进行的操作。更新不会自动刷新那些页面；再次打开时会使用新版。</p>
<small id="revision">TAROT_BUILD_REVISION</small>
</main>
<script>
(()=>{
'use strict';
const revision='TAROT_BUILD_REVISION';
const en=new URL(location.href).searchParams.get('lang')==='en';
let english=en,registration,busy=false,prepared=false,phase='idle',error='',downloaded=0,total=0;
const copy={title:['带着记录，进入新版','Bring your progress into the new version'],intro:['下载并校验新版完整内容，再由你决定何时进入。学习进度、抽牌和日签记录保留在本机。','Download and verify the complete new release, then choose when to open it. Learning, readings and daily cards stay on this device.'],download:['检查并下载新版','Check and download update'],continue:['保留记录，进入新版','Keep my records and open update'],back:['返回当前应用','Return to current app'],note:['请先完成其他标签页中正在进行的操作。更新不会自动刷新那些页面；再次打开时会使用新版。','Finish any actions in other tabs first. This update will not reload those pages. Reopen them to use the new version.'],idle:['这是独立更新入口，可以从旧离线版本切换到本次发布。','This separate update page can upgrade an older offline release.'],downloading:['正在下载并检查全部应用文件和 78 张牌图…','Downloading and verifying all app files and 78 card images…'],ready:['新版完整性检查通过。点下方按钮后进入，已有记录不会被清除。','The complete release is verified. Continue below; your existing records will be retained.'],activating:['正在切换到已校验的新版…','Switching to the verified release…'],failed:['更新未完成。当前版本和已有记录保留，请保持联网后重试。','Update did not finish. The current release and existing records are preserved. Reconnect and retry.'],unsupported:['请在 Safari 或 Chrome 中打开此 HTTPS 页面。','Open this HTTPS page in Safari or Chrome.']};
const get=id=>document.getElementById(id),t=id=>copy[id][english?1:0];
function render(){document.documentElement.lang=english?'en':'zh-CN';for(const id of ['title','intro','download','continue','back','note'])get(id).textContent=t(id);get('language').textContent=english?'中文':'EN';get('back').href='./?lang='+(english?'en':'zh');get('status').textContent=t(phase)+(total&&phase==='downloading'?' '+downloaded+' / '+total:'');get('progress').hidden=!total||phase!=='downloading';get('progress').max=total||1;get('progress').value=downloaded;get('download').disabled=busy;get('download').classList.toggle('hidden',prepared);get('continue').classList.toggle('hidden',!prepared);get('continue').disabled=busy;}
function request(worker,type){return new Promise((resolve,reject)=>{if(!worker){reject(Error('no-worker'));return;}const channel=new MessageChannel(),timer=setTimeout(()=>reject(Error('timeout')),180000);channel.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data);};worker.postMessage({type},[channel.port2]);});}
async function candidate(){const worker=registration.waiting||registration.active;if(!worker)return null;const result=await request(worker,'TAROT_OFFLINE_STATUS');return result.ready&&result.revision===revision?{worker,result}:null;}
function waitForInstall(){return new Promise((resolve,reject)=>{const deadline=setTimeout(()=>reject(Error('install-timeout')),180000);let checking=false;const check=async()=>{if(checking)return;checking=true;try{const found=await candidate();if(found){clearTimeout(deadline);resolve(found);return;}const worker=registration.installing;if(worker){worker.addEventListener('statechange',()=>{if(worker.state==='redundant'){clearTimeout(deadline);reject(Error('install-failed'));}else if(['installed','activated'].includes(worker.state))check();},{once:true});}}catch(e){clearTimeout(deadline);reject(e);}finally{checking=false;}};registration.addEventListener('updatefound',()=>{const worker=registration.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='redundant'){clearTimeout(deadline);reject(Error('install-failed'));}if(['installed','activated'].includes(worker.state))check();});});const worker=registration.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='redundant'){clearTimeout(deadline);reject(Error('install-failed'));}if(['installed','activated'].includes(worker.state))check();});check();});}
get('download').addEventListener('click',async()=>{if(busy)return;if(!isSecureContext||!('serviceWorker' in navigator)){phase='unsupported';render();return;}busy=true;phase='downloading';render();try{registration=await navigator.serviceWorker.register(new URL('sw.js',location.href),{scope:'./',updateViaCache:'none'});await registration.update();let found=await candidate();if(!found&&!registration.installing&&registration.active){const current=await request(registration.active,'TAROT_OFFLINE_STATUS');if(current.revision===revision){const repaired=await request(registration.active,'TAROT_OFFLINE_REPAIR');if(repaired.ready)found={worker:registration.active,result:repaired};}}if(!found)found=await waitForInstall();prepared=!!found;phase='ready';}catch(e){error=e.message;phase='failed';}finally{busy=false;render();}});
get('continue').addEventListener('click',async()=>{if(busy||!prepared)return;busy=true;phase='activating';render();try{const found=await candidate();if(!found)throw Error('not-ready');if(registration.waiting){const result=await request(registration.waiting,'TAROT_OFFLINE_ACTIVATE');if(!result.ready)throw Error('not-ready');}const deadline=Date.now()+15000;while(Date.now()<deadline){const worker=registration.active;if(worker===found.worker&&worker?.state==='activated'){const status=await request(worker,'TAROT_OFFLINE_STATUS');if(status.ready&&status.revision===revision){location.replace('./?lang='+(english?'en':'zh')+'&v='+encodeURIComponent(revision));return;}}await new Promise(resolve=>setTimeout(resolve,100));}throw Error('activation-timeout');}catch(e){error=e.message;phase='failed';prepared=false;busy=false;render();}});
get('language').addEventListener('click',()=>{english=!english;render();});
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',event=>{if(event.data?.type==='TAROT_OFFLINE'&&event.data.revision===revision){if(event.data.phase==='downloading'){downloaded=event.data.done;total=event.data.total;render();}}});
window.TarotUpdate={get state(){return {revision,phase,prepared,error,downloaded,total};}};
render();
})();
</script></body></html>
